# PLANTILLA de modelo.toml: un modelo mínimo y válido, para reemplazar por el de la corrida.
# El formato completo está en referencias/formato-modelo.md y el caso Volutus, en ejemplos/volutus/.
# Orden: parámetros y distribuciones (fijan los sorteos), variables (orden de evaluación), restricciones,
# reglas con evidencia, cadena de uso, métricas, perfiles, cobertura, sensibilidad e hipótesis.
[modelo]
nombre = "PLANTILLA: reemplaza este modelo"

[corrida]
semilla = 20261120
# poblacion = 120000
# representativos = 12
# sorteos_parametros = 200
# usuarios_incertidumbre = 3000
# usuarios_hipotesis = 20000

[[parametros]]
id = "movil"
p50 = 0.5
p10 = 0.3
p90 = 0.7
fuente = "prior:elicitacion"

[[parametros]]
id = "escribe"
p50 = 0.4
p10 = 0.2
p90 = 0.6
fuente = "prior:elicitacion"

[[parametros]]
id = "falla_movil"
p50 = 0.2
p10 = 0.1
p90 = 0.4
fuente = "prior:elicitacion"

[[parametros]]
id = "arreglo"
interruptor = true

[[distribuciones]]
id = "canal"
valores = { google = 0.6, redes = 0.4 }
kappa = 20
fuente = "prior:elicitacion"

[[variables]]
id = "canal"
valores = ["google", "redes"]
soporte = [{ cita = "a.js:1", extracto = "uno" }]
  [[variables.casos]]
  dist = "canal"

[[variables]]
id = "movil"
valores = [true, false]
soporte = [{ cita = "a.js:1", extracto = "uno" }]
  [[variables.casos]]
  prob = "p.movil"

[[reglas]]
id = "R1"
texto = "En celular el envío falla"
friccion = true
cw = ["sí", "sí", "sí", "no"]
nota_cw = "No ve por qué falla."
evidencia = [{ cita = "a.js:2", extracto = "dos" }]

[cadena]
inicio = "inicio"
atribuibles = ["abandono_por_friccion", "contacto_con_friccion"]
perdida = ["abandono_por_friccion"]
con_friccion = { contacto = "contacto_con_friccion" }

[cadena.desenlaces]
contacto = "Contacto"
contacto_con_friccion = "Contacto con fricción"
abandono = "Se va"
abandono_por_friccion = "Se va por fricción"

[[estados]]
id = "inicio"
nombre = "Llegada"
superficies = ["portada"]
  [[estados.ramas]]
  prob = "p.escribe"
  va = "envio"
  accion = "escribe por {canal}"
  arco = "escribe"
  [[estados.ramas]]
  prob = "1 - p.escribe"
  va = "FIN:abandono"
  accion = "se va"

[[estados]]
id = "envio"
nombre = "Envío"
superficies = ["formulario"]
locales = { f = "p.falla_movil if movil and not p.arreglo else 0.0" }
  [[estados.ramas]]
  prob = "1 - f"
  va = "FIN:contacto"
  accion = "envía"
  [[estados.ramas]]
  prob = "f * 0.5"
  va = "reintento"
  accion = "falla y reintenta"
  regla = "R1"
  [[estados.ramas]]
  prob = "f * 0.5"
  va = "FIN:abandono_por_friccion"
  accion = "falla y se va"
  regla = "R1"

[[estados]]
id = "reintento"
nombre = "Reintento"
  [[estados.ramas]]
  prob = "1.0"
  va = "FIN:contacto"
  accion = "reintenta y llega"

[[metricas]]
id = "contacto_total"
expr = "contacto + contacto_con_friccion"

[[metricas]]
id = "perdida"
expr = "abandono_por_friccion"

[[perfiles]]
id = "P1"
nombre = "Celular"
si = "movil"

[[perfiles]]
id = "P2"
nombre = "Escritorio"
si = "True"

[[factores]]
id = "canal"
expr = "canal"

[[factores]]
id = "movil"
expr = "movil"

[[superficies]]
id = "portada"

[[superficies]]
id = "formulario"

[cobertura]
candidatos_universo = 200
candidatos_por_vuelta = 50
universo_arcos = 100

[cobertura.aplanada.parametros]
movil = 0.5

[sensibilidad]
parametros = ["movil", "escribe", "falla_movil"]
metricas = ["contacto_total", "perdida"]
ordenar_por = "perdida"
trayectorias = 3
usuarios = 200

[[hipotesis]]
id = "arreglo"
texto = "Arreglar el envío en celular"
cambios = { arreglo = true }
