# Statfish · caso Volutus en el formato de la herramienta.
#
# Es la traducción declarativa de referencia/modelo.py (el script del caso). Con la semilla 20261120
# da las mismas cifras que ese script: el orden de las ramas, de los parámetros y de las
# distribuciones importa, porque fija el orden de los sorteos y de las sumas.

[modelo]
nombre = "Volutus, landing: quién no logra cotizar ni contactar"
descripcion = "Red de perfiles y cadena de uso de la landing de Volutus (VolutusDevelopment/VolutusLandingPage @ 76b713a)."
nota = "Caso de prueba de la viabilidad. Los priors salen de una sola elicitación del agente que hizo el caso (K = 1), sin mezcla de elicitaciones independientes."

[corrida]
semilla = 20261120
uniformes = 26
poblacion = 120000
representativos = 12
sorteos_parametros = 200
usuarios_incertidumbre = 3000
usuarios_hipotesis = 20000

[informe]
titulo = "Volutus: quién no logra cotizar ni contactar"
metricas_principales = ["contacto_total", "perdida_por_codigo", "con_friccion"]

