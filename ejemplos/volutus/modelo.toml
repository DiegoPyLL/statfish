# ------------------------------------------------------------------------------------------------
# Restricciones duras: ningún usuario puede violarlas.
# ------------------------------------------------------------------------------------------------
[[restricciones]]
texto = "iOS y iPadOS usan WebKit, sea cual sea el navegador"
expr = "sistema not in ('ios', 'ipados') or motor == 'webkit'"
evidencia = [{ cita = "CLAUDE.md:124", extracto = "El sitio debe funcionar bien en Safari de macOS, iOS y iPadOS" }]

[[restricciones]]
texto = "El navegador de una app es su propio webview"
expr = "not inapp or navegador == 'webview de la app'"

[[restricciones]]
texto = "Un agente WebMCP exige escritorio, Chrome o Edge, y JS activo"
expr = "not agente or (dispositivo == 'escritorio' and navegador in ('chrome', 'edge') and not js_off)"
evidencia = [{ cita = "src/components/Contacto.jsx:40-43", extracto = "Lleva las anotaciones de WebMCP, para que un agente de IA pueda rellenarlo." }]

[[restricciones]]
texto = "/brief-web solo se abre con el link: todo el que llega ahí es cliente"
expr = "destino != 'brief' or relacion == 'cliente_brief'"
evidencia = [{ cita = "src/lib/meta.js:301-310", extracto = "// El brief que Volutus le manda a un cliente por link (paginas/Brief.jsx)." }]

[[restricciones]]
texto = "Smart Punctuation solo se modela en iOS y iPadOS"
expr = "not smart_punct or sistema in ('ios', 'ipados')"

[[restricciones]]
texto = "«Ley de datos» no tiene página de servicio: su página es /ley21719"
expr = "not (servicio == 'datos' and destino == 'servicio')"
evidencia = [{ cita = "src/lib/servicios.js:132-143", extracto = "id: 'datos'," }]

# ------------------------------------------------------------------------------------------------
# Reglas del código, con evidencia y recorrido cognitivo (¿intenta el efecto correcto?, ¿nota la
# acción?, ¿la asocia al efecto?, ¿ve el progreso?).
