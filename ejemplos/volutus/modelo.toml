    [[estados.casos.ramas]]
    prob = "q * (1 - p.usa_cta_brief_web)"
    va = "form"
    con = { donde = "'servicio'" }
    accion = "baja al formulario"

  # Hipótesis: la guía de la ley trae su propio formulario con el servicio marcado.
  [[estados.casos]]
  si = "donde == 'ley' and p.arreglo_r8"

    [[estados.casos.ramas]]
    prob = "1 - q"
    va = "FIN:abandono_sin_intento"
    accion = "decide no escribir por ahora"

    [[estados.casos.ramas]]
    prob = "q"
    va = "form"
    con = { donde = "'servicio'" }
    accion = "va al formulario de la guía"

  [[estados.casos]]
  si = "donde == 'ley'"

    [[estados.casos.ramas]]
    prob = "1 - q"
    va = "FIN:abandono_sin_intento"
    accion = "decide no escribir por ahora"

    [[estados.casos.ramas]]
    prob = "q"
    va = "form"
    con = { donde = "'home'" }
    accion = "pulsa «Cuéntanos tu proyecto»: va al formulario de la portada"
    regla = "R8b"

  [[estados.casos]]

    [[estados.casos.ramas]]
    prob = "1 - q"
    va = "FIN:abandono_sin_intento"
    accion = "decide no escribir por ahora"

    [[estados.casos.ramas]]
    prob = "q"
    va = "form"
    con = { donde = "donde" }
    accion = "va al formulario"

[[estados]]
