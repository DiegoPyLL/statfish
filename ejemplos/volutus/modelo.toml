# ------------------------------------------------------------------------------------------------
# Red de perfiles. Orden de evaluación = orden de declaración; cada variable aleatoria tiene su
# uniforme (el índice viene del script del caso).
# ------------------------------------------------------------------------------------------------
[[variables]]
id = "relacion"
texto = "Prospecto, o cliente con el link del brief"
valores = ["cliente_brief", "prospecto"]
uniforme = 0
soporte = [{ cita = "src/lib/meta.js:301-310", extracto = "// El brief que Volutus le manda a un cliente por link (paginas/Brief.jsx)." }]

  [[variables.casos]]
  dist = { cliente_brief = "p.relacion_cliente_brief", prospecto = "1 - p.relacion_cliente_brief" }

[[variables]]
id = "canal"
texto = "Canal de llegada"
valores = ["google", "articulo", "recomendacion", "redes", "directo", "ia", "link_del_brief"]
uniforme = 1
soporte = [{ cita = "public/robots.txt:4", extracto = "Content-Signal: search=yes, ai-input=yes, ai-train=yes" }]

  [[variables.casos]]
  si = "relacion == 'cliente_brief'"
  valor = "'link_del_brief'"

  [[variables.casos]]
  dist = "canal"

[[variables]]
id = "dispositivo"
valores = ["escritorio", "movil", "tablet"]
uniforme = 2
soporte = [{ cita = "CLAUDE.md:102-119", extracto = "## 5. Responsive Design" }]

  [[variables.casos]]
  si = "relacion == 'cliente_brief'"
  dist = "disp_cliente"

  [[variables.casos]]
  si = "canal == 'redes'"
  dist = { movil = "p.movil_si_redes", tablet = "0.01", escritorio = "1 - p.movil_si_redes - 0.01" }

  [[variables.casos]]
  si = "canal == 'recomendacion'"
  dist = { movil = "p.movil_si_recomendacion", tablet = "0.01", escritorio = "1 - p.movil_si_recomendacion - 0.01" }

  [[variables.casos]]
  dist = "disp_base"

[[variables]]
id = "sistema"
