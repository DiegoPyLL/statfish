nombre = "Envío por correo{' (2.º intento)' if intento == 2 else ''}"
superficies = ["POST /api/contacto"]

[estados.locales]
tn = "(p.token_no_listo_agente if intento == 1 else 0.02) if agente else (((p.token_no_listo_rapido_movil if dispositivo != 'escritorio' else p.token_no_listo_rapido_escritorio) if intento == 1 else 0.02) if pega_rapido else (p.token_no_listo_normal if intento == 1 else 0.002))"
