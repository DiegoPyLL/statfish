    prob = "p.pide_cotizacion"
    va = "ley_a_portada"
    accion = "pulsa «Pedir esta cotización»: va a la portada"
    regla = "R8"

    [[estados.casos.ramas]]
    prob = "1 - p.pide_cotizacion"
