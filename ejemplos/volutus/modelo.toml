id = "destino"
texto = "Página a la que llega"
valores = ["servicio", "home", "articulo", "ley", "brief"]
uniforme = 19
soporte = [{ cita = "src/lib/meta.js:39-479", extracto = "export const PAGINAS = {" }]

  [[variables.casos]]
  si = "relacion == 'cliente_brief'"
  valor = "'brief'"

  [[variables.casos]]
  si = "canal == 'google'"
  dist = "destino_google"
  transformar = "'ley' if x == 'servicio' and servicio == 'datos' else ('home' if x == 'servicio' and servicio == 'no_sabe' else x)"

  [[variables.casos]]
  si = "canal == 'articulo'"
  dist = "destino_articulo"
  transformar = "'ley' if x == 'servicio' and servicio == 'datos' else ('home' if x == 'servicio' and servicio == 'no_sabe' else x)"

  [[variables.casos]]
  si = "canal == 'recomendacion'"
  dist = "destino_recomendacion"
  transformar = "'ley' if x == 'servicio' and servicio == 'datos' else ('home' if x == 'servicio' and servicio == 'no_sabe' else x)"

  [[variables.casos]]
  si = "canal == 'redes'"
  dist = "destino_redes"
  transformar = "'ley' if x == 'servicio' and servicio == 'datos' else ('home' if x == 'servicio' and servicio == 'no_sabe' else x)"

  [[variables.casos]]
  si = "canal == 'directo'"
  dist = "destino_directo"
  transformar = "'ley' if x == 'servicio' and servicio == 'datos' else ('home' if x == 'servicio' and servicio == 'no_sabe' else x)"

  [[variables.casos]]
  dist = "destino_ia"
  transformar = "'ley' if x == 'servicio' and servicio == 'datos' else ('home' if x == 'servicio' and servicio == 'no_sabe' else x)"

