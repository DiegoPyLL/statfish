[[reglas]]
id = "R1"
texto = "El nombre solo admite letras, marcas, espacio y apóstrofo recto: rechaza guion, punto, dígitos y &"
friccion = true
patron = "P-NOMBRE-SOLO-LETRAS"
cw = ["sí", "sí", "sí", "en parte"]
nota_cw = "El aviso dice qué hacer, pero le pide escribir su nombre (o el de su negocio) de otra forma."
evidencia = [
  { cita = "src/lib/contacto.js:89-91", extracto = "export const NOMBRE_VALIDO = /^[\\p{L}\\p{M}' ]+$/u" },
  { cita = "src/client.js:82-85", extracto = "if (campo.name === 'nombre' && !NOMBRE_VALIDO.test(valor)) {" },
  { cita = "worker/index.js:99-101", extracto = "if (!NOMBRE_VALIDO.test(nombre) || !proyecto || !CORREO_VALIDO.test(correo)) {" },
  { cita = "src/comportamiento/brief/brief.js:350", extracto = "!NOMBRE_VALIDO.test(n) && ERRORES_BRIEF.nombreInvalido" },
  { cita = "worker/brief.js:292-294", extracto = "if (!NOMBRE_VALIDO.test(nombre) || !(correo || telefono)" },
]

[[reglas]]
id = "R1+R2"
texto = "En iPhone y iPad el apóstrofo se escribe ’ (Smart Punctuation) y la regla del nombre lo rechaza"
friccion = true
patron = "P-NOMBRE-SOLO-LETRAS"
cw = ["sí", "sí", "sí", "no"]
nota_cw = "El aviso «Usa solo letras.» contradice lo que ve: su nombre solo tiene letras y un apóstrofo, que la regla quiere aceptar (O'Higgins), y el cambio a ’ no se nota."
evidencia = [
  { cita = "src/lib/contacto.js:89-91", extracto = "export const NOMBRE_VALIDO = /^[\\p{L}\\p{M}' ]+$/u" },
  { cita = "src/components/Contacto.jsx:121-130", extracto = "toolparamdescription=\"Nombre de quien escribe\"" },
  { cita = "src/client.js:82-85", extracto = "if (campo.name === 'nombre' && !NOMBRE_VALIDO.test(valor)) {" },
]

