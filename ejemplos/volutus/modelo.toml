rf = "p.resend_falla"

  [[estados.ramas]]
  prob = "(1 - tn) * (1 - tf) * (1 - rf)"
  va = "FIN:contacto"
  accion = "envía: «¡Gracias por escribirnos!»"

  [[estados.ramas]]
  prob = "tn"
  va = "tras_error"
  con = { intento = "intento", causa = "'R4'" }
  accion = "envía antes de que llegue el token: 403 «No pudimos enviar tu mensaje…»"
  regla = "R4"

  [[estados.ramas]]
  prob = "(1 - tn) * tf"
  va = "tras_error"
  con = { intento = "intento", causa = "'R4b'" }
  accion = "Turnstile no pasa: 403 «No pudimos enviar tu mensaje…»"
  regla = "R4b"

  [[estados.ramas]]
  prob = "(1 - tn) * (1 - tf) * rf"
  va = "tras_error"
  con = { intento = "2", causa = "'R5'" }
  accion = "Resend no responde: 502"
  regla = "R5"

[[estados]]
id = "tras_error"
args = ["intento", "causa"]
nombre = "Tras el error"
locales = { r = "p.reintenta_tras_403 if intento == 1 else 0.0", c = "p.correo_directo_tras_error" }

  [[estados.ramas]]
  prob = "r"
  va = "envio_correo"
  con = { intento = "2" }
  accion = "cierra el aviso y vuelve a enviar"
  regla = "{causa}"

  [[estados.ramas]]
  prob = "(1 - r) * c"
  va = "FIN:correo_directo"
  accion = "copia el correo del aviso y escribe desde su correo"
  regla = "{causa}"

  [[estados.ramas]]
  prob = "(1 - r) * (1 - c)"
  va = "FIN:abandono_por_friccion"
  accion = "cree que el sitio falla y se va"
  regla = "{causa}"

[[estados]]
id = "nojs"
nombre = "Respuesta sin JavaScript"
superficies = ["POST /api/contacto"]

[estados.locales]
aviso = "'página «No pudimos enviar tu mensaje. Escríbenos directamente a…»' if (nombre_tipo == 'simple' or (nombre_tipo == 'apostrofo' and not smart_punct)) else 'página «Faltan datos o el correo no es válido…»'"
c = "p.nojs_correo_directo"

  [[estados.ramas]]
  prob = "c"
  va = "FIN:correo_directo"
  accion = "{aviso}: escribe desde su correo"
  regla = "R7"

  [[estados.ramas]]
  prob = "1 - c"
  va = "FIN:abandono_por_friccion"
  accion = "{aviso}: se va"
  regla = "R7"

[[estados]]
id = "brief_envio"
nombre = "Envío del brief"
superficies = ["POST /api/brief"]

  # Hipótesis: sin JS el brief responde como el contacto, con el correo directo.
  [[estados.casos]]
  si = "js_brief_falla and p.arreglo_r21"

    [[estados.casos.ramas]]
    prob = "p.nojs_correo_directo"
    va = "FIN:correo_directo"
    accion = "página con el correo: escribe desde su correo"
    regla = "R21"

    [[estados.casos.ramas]]
    prob = "1 - p.nojs_correo_directo"
    va = "FIN:abandono_por_friccion"
    accion = "página con el correo: se va"
    regla = "R21"

  [[estados.casos]]
  si = "js_brief_falla"

    [[estados.casos.ramas]]
    prob = "1.0"
    va = "FIN:perdida_silenciosa"
    accion = "POST nativo con «transcurrido» vacío: «Recibimos tu brief.» y no llega nada"
    regla = "R21"

  [[estados.casos]]

  [estados.casos.locales]
  a = "p.brief_rapido_si_agente if agente else 0.0"
  resto = "1 - a"
  cr = "p.carrera_turnstile_brief"
  tf = "p.turnstile_falla_estricta if estricta else p.turnstile_falla_normal"
  e = "cr + (1 - cr) * tf"
  rb = "p.reintenta_brief"

    [[estados.casos.ramas]]
    si = "not p.arreglo_r21"
    prob = "a"
    va = "FIN:perdida_silenciosa"
    accion = "el agente lo llena y la persona envía antes de 8 s: «Recibimos tu brief.» y no llega nada"
    regla = "R10"

    # Hipótesis: el apuro deja de ser silencioso; un aviso visible y el reintento llega.
    [[estados.casos.ramas]]
    si = "p.arreglo_r21"
    prob = "a"
    va = "FIN:contacto"
    accion = "aviso visible: espera y reintenta"
    regla = "R10"

    [[estados.casos.ramas]]
    prob = "resto * (1 - e)"
    va = "FIN:contacto"
    accion = "envía: «Tu número de referencia es B-…»"

    [[estados.casos.ramas]]
    prob = "resto * e * rb"
    va = "FIN:contacto"
    accion = "falla el envío; sus respuestas siguen guardadas y reintenta"
    regla = "R11"

    [[estados.casos.ramas]]
    prob = "resto * e * (1 - rb)"
    va = "FIN:correo_directo"
    accion = "falla el envío; copia sus respuestas y las manda por correo"
    regla = "R11"

