[[estados]]
id = "decide"
args = ["donde"]
nombre = "¿Escribe?"
locales = { q = "p.contacta_explorando if etapa == 'explorando' else (p.contacta_comparando if etapa == 'comparando' else p.contacta_listo)" }

  [[estados.casos]]
  si = "donde == 'servicio' and servicio == 'web'"

    [[estados.casos.ramas]]
    prob = "1 - q"
    va = "FIN:abandono_sin_intento"
    accion = "decide no escribir por ahora"

    [[estados.casos.ramas]]
    prob = "q * p.usa_cta_brief_web"
    va = "brief_prospecto"
    accion = "pulsa «Cuéntanos tu proyecto» de la cabecera: abre el brief"
