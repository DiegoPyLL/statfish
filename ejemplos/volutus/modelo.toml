# ------------------------------------------------------------------------------------------------
# Cadena de uso (Whittaker y Thomason): estados con argumentos, casos (se aplica el primero que
# calza) y ramas. Un arco es (estado, arco o acción); las rutas concretas son superficies.
# ------------------------------------------------------------------------------------------------
[cadena]
inicio = "inicio"
profundidad_maxima = 30
atribuibles = ["abandono_por_friccion", "perdida_silenciosa", "correo_directo", "contacto_con_friccion"]
perdida = ["abandono_por_friccion", "perdida_silenciosa"]
con_friccion = { contacto = "contacto_con_friccion" }

[cadena.desenlaces]
contacto = "Contacto sin fricción"
contacto_con_friccion = "Contacto después de una fricción"
correo_directo = "Escribe al correo tras un error"
no_envia_whatsapp = "Abre WhatsApp y no envía"
abandono_sin_intento = "Se va sin intentar contactar"
abandono_por_friccion = "Se va por una fricción del código"
perdida_silenciosa = "Envía y no llega nada (silencio)"

[[estados]]
id = "inicio"
nombre = "Llegada"

  [[estados.casos]]
  si = "relacion == 'cliente_brief'"

    [[estados.casos.ramas]]
    prob = "1.0"
    va = "brief_cliente"
    accion = "abre el link del brief que le mandó Volutus"
    regla = "R17"
    superficies = ["/brief-web"]

  [[estados.casos]]

    [[estados.casos.ramas]]
    prob = "1.0"
    va = "pagina"
    con = { donde = "destino", momento = "'llegada'" }
    accion = "llega a {'/' if destino == 'home' else ('un artículo' if destino == 'articulo' else ('/ley21719' if destino == 'ley' else ruta_servicio))}"
    arco = "llega a {'la portada' if destino == 'home' else ('un artículo' if destino == 'articulo' else ('/ley21719' if destino == 'ley' else 'la página de su servicio'))}"
    superficies = ["{'/' if destino == 'home' else ('un artículo' if destino == 'articulo' else ('/ley21719' if destino == 'ley' else ruta_servicio))}"]

[[estados]]
id = "pagina"
args = ["donde", "momento"]
nombre = "En {'/' if donde == 'home' else ('un artículo' if donde == 'articulo' else ('/ley21719' if donde == 'ley' else ruta_servicio))}"

[estados.locales]
q_sale = "(p.sale_explorando if etapa == 'explorando' else (p.sale_comparando if etapa == 'comparando' else p.sale_listo)) if momento == 'llegada' else 0.0"
resto = "1 - q_sale"

  [[estados.casos]]
  si = "donde in ('home', 'articulo')"
  locales = { q = "0.0 if servicio == 'no_sabe' else (p.home_a_servicio if donde == 'home' else p.articulo_a_servicio)" }

    [[estados.casos.ramas]]
    prob = "q_sale"
    va = "FIN:abandono_sin_intento"
    accion = "se va sin buscar más"

    [[estados.casos.ramas]]
    prob = "resto * q"
    va = "pagina"
    con = { donde = "'ley' if servicio == 'datos' else 'servicio'", momento = "'navegando'" }
    accion = "va a {'/ley21719' if servicio == 'datos' else ruta_servicio}"
    arco = "va a {'/ley21719' if servicio == 'datos' else 'la página de su servicio'}"
    superficies = ["{'/ley21719' if servicio == 'datos' else ruta_servicio}"]

    [[estados.casos.ramas]]
    prob = "resto * (1 - q)"
    va = "decide"
    con = { donde = "donde" }
    accion = "{'sigue en la portada' if donde == 'home' else 'termina el artículo'}"

  [[estados.casos]]
  si = "donde == 'servicio'"

    [[estados.casos.ramas]]
    prob = "q_sale"
    va = "FIN:abandono_sin_intento"
    accion = "se va sin buscar más"

    [[estados.casos.ramas]]
    si = "agente"
    prob = "resto * p.usa_estimado"
    va = "estimado"
    con = { donde = "'servicio'" }
    accion = "el agente usa «estimar_precio» y recibe el estimado"
    regla = "R16"

    [[estados.casos.ramas]]
    si = "not agente"
    prob = "resto * p.usa_estimado"
    va = "estimado"
    con = { donde = "'servicio'" }
    accion = "calcula un estimado"

    [[estados.casos.ramas]]
    prob = "resto * (1 - p.usa_estimado)"
    va = "decide"
    con = { donde = "'servicio'" }
    accion = "lee la página sin calcular"

  [[estados.casos]]
  si = "donde == 'ley'"

    [[estados.casos.ramas]]
    prob = "q_sale"
    va = "FIN:abandono_sin_intento"
    accion = "se va sin buscar más"

    [[estados.casos.ramas]]
    prob = "resto * p.usa_estimado_ley"
    va = "estimado"
    con = { donde = "'ley'" }
    accion = "calcula un estimado de la ley de datos"

    [[estados.casos.ramas]]
    prob = "resto * (1 - p.usa_estimado_ley)"
    va = "decide"
    con = { donde = "'ley'" }
    accion = "lee la guía sin calcular"

[[estados]]
id = "estimado"
args = ["donde"]
nombre = "Estimado{' de la ley de datos' if donde == 'ley' else ''}"
superficies = ["estimado"]

  [[estados.casos]]
