id = "H-R9"
regla = "R9"
patron = "P-MISMO-TEXTO-DOS-DESTINOS"
titulo = "«Cuéntanos tu proyecto» lleva al brief de 35 a 45 min en desarrollo web y al formulario en la barra"
estado = "issue #77"
perfiles = ["S2", "S1"]
commit = "76b713a"
evidencia = [
  { cita = "src/data/paginas-de-servicio.js:66", extracto = "proyecto: '/brief-web'," },
  { cita = "src/components/Barra.jsx:158", extracto = "ancla('contacto')}>Cuéntanos tu proyecto</a>" },
]
resumen = "La mayor pérdida en el {{robustez.top1_perdida.R9|pct}} de los sorteos; arreglarla baja la pérdida por código de {{hipotesis.base.perdida_por_codigo|pct:2}} a {{hipotesis.r9.perdida_por_codigo|pct:2}}."
cuerpo = '''
Hallado en el caso de prueba de Statfish: recorrido del código de `main` @ `{{contexto.repo.commit_corto|texto}}`, {{contexto.corrida.fecha|texto}}, sin cambiar nada del repo.

## Qué pasa

- En `/servicios/desarrollo-web`, el «Cuéntanos tu proyecto» de la cabecera lleva a `/brief-web` (`src/data/paginas-de-servicio.js:66`, `src/paginas/Servicio.jsx:89`). Ese brief tiene 9 partes y toma de 35 a 45 min (`src/lib/brief/preguntas.js:89-93`), y está pensado para clientes que ya recibieron el link.
- El «Cuéntanos tu proyecto» de la barra lleva al formulario corto de la misma página (`src/components/Barra.jsx:158`).
- La documentación no coincide: `src/paginas/Brief.jsx:10-12` dice que el brief «No se enlaza desde el sitio», pero `src/lib/meta.js:301-302` y el README dicen que sí.

Es una decisión documentada en el README, no un error. Este issue es para decidirla con datos.

## Quién lo encontró

- **U25:** Antofagasta, listo para encargar su sitio. En las trazas forzadas abre el brief, ve «35 a 45 min» y lo deja para después, o vuelve y usa el formulario.
- **El perfil de escritorio que busca una página web.**

## Impacto (cifras del modelo, no del mercado)

Es la **mayor pérdida del modelo** en el {{robustez.top1_perdida.R9|pct:0}} de {{robustez.n}} sorteos de los supuestos, y queda entre las tres mayores en el {{robustez.top3_perdida.R9|pct:0}}. Se pierden cerca de {{reglas.R9.perdida|mil:1}} de cada 1.000 visitantes, y {{perfiles.S2.reglas.R9.perdida|mil:0}} de cada 1.000 entre quienes buscan una página web desde el escritorio. Si la cabecera llevara al formulario, la pérdida atribuible al código bajaría de {{hipotesis.base.perdida_por_codigo|pct:2}} a {{hipotesis.r9.perdida_por_codigo|pct:2}} de las visitas. El supuesto que más pesa es cuántos prospectos completan el brief: entre el {{parametros.envia_brief_prospecto.p10|pct:0}} y el {{parametros.envia_brief_prospecto.p90|pct:0}}.

## Propuesta (para discutir, no implementada)

- [ ] Que la cabecera lleve al formulario, como en los otros servicios, y ofrecer el brief después.
- [ ] O cambiar el texto del botón para que diga lo que abre, por ejemplo «Llena el brief (35 a 45 min)».
- [ ] Corregir el comentario de `src/paginas/Brief.jsx:10-12`.
'''

[[hallazgos]]
id = "H-R8"
regla = "R8"
patron = "P-ESTADO-PERDIDO-ENTRE-PAGINAS"
titulo = "Desde /ley21719, «Pedir esta cotización» llega a un formulario vacío y sin el servicio"
estado = "issue #78"
perfiles = ["S5"]
commit = "76b713a"
evidencia = [{ cita = "src/paginas/Ley21719.jsx:429", extracto = "<Estimado servicio=\"datos\" contacto=\"/#contacto\" />" }]
resumen = "Entre quienes buscan la ley de datos, {{perfiles.S5.reglas.R8.friccion|mil:1}} de cada 1.000 reescriben lo marcado y {{perfiles.S5.reglas.R8.perdida|mil:1}} se van."
cuerpo = '''
Hallado en el caso de prueba de Statfish: recorrido del código de `main` @ `{{contexto.repo.commit_corto|texto}}`, {{contexto.corrida.fecha|texto}}, sin cambiar nada del repo.

## Qué pasa

- `/ley21719` es la página del servicio «Ley de datos». Tiene estimado, pero no formulario.
- «Pedir esta cotización» lleva a `/#contacto` (`src/paginas/Ley21719.jsx:429`). Como el formulario no está en la misma página, lo marcado no se escribe en el mensaje (`src/components/Estimado.jsx:48`, `src/components/Estimado.jsx:204-207`).
- El formulario de la portada llega sin «Adaptarme a la ley de datos» marcado (`src/paginas/Inicio.jsx:33`). Lo mismo pasa con el «Cuéntanos tu proyecto» del cierre (`src/paginas/Ley21719.jsx:264`).
- En los otros siete servicios, el mensaje llega escrito y el servicio marcado (`src/comportamiento/estimado.js:61-72`, `src/paginas/Servicio.jsx:72-74`).

## Quién lo encontró

- **U24:** Coquimbo, le recomendaron la guía de la ley. En las trazas forzadas calcula el estimado y pulsa «Pedir esta cotización». Llega a un formulario vacío y se va, o reescribe lo que había marcado.

## Impacto (cifras del modelo, no del mercado)

Entre quienes buscan adaptarse a la ley de datos, **{{perfiles.S5.reglas.R8.friccion|mil:0}} de cada 1.000** llegan al contacto después de reescribir lo que habían marcado, y **{{perfiles.S5.reglas.R8.perdida|mil:1}} de cada 1.000 se van**. Cuántos buscan la ley es el supuesto más incierto del modelo, entre el {{intervalos.masa_S5.p5|pct}} y el {{intervalos.masa_S5.p95|pct}} de las visitas, y la ley rige desde el 1 de diciembre.

## Propuesta (para discutir, no implementada)

- [ ] Poner el formulario de contacto al final de `/ley21719`, con el servicio marcado, como en las páginas de servicio.
- [ ] O llevar lo marcado en el enlace o en `sessionStorage`, y escribirlo al llegar al formulario de la portada.
'''

